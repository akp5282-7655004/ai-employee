<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miles — Sign in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='1.5' y='1.5' width='97' height='97' rx='26' fill='%23111112'/><g fill='none' stroke='%23fff' stroke-width='8'><path d='M31.6 31.6A26 26 0 0 0 68.4 68.4' stroke-opacity='.22'/><path d='M31.6 31.6A26 26 0 0 1 68.4 68.4'/></g><circle cx='42' cy='50' r='4' fill='%23fff'/><circle cx='58' cy='50' r='4' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
</head>
<body>
<style>
  :root{
    --bg:#F4F4F5; --card:#FFFFFF; --ink:#111112; --graphite:#3F3F46; --muted:#8A8A92; --faint:#8A8A92;
    --line:#E6E6EA; --panel-2:#F4F4F5; --primary:#111112; --primary-ink:#FFFFFF; --accent:#2B6FCB; --brand:#111112;
    --warn:#86651C; --sans:'Archivo',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(15,18,22,.05),0 12px 40px rgba(15,18,22,.10);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#111112; --card:#1A1A1C; --ink:#FFFFFF; --graphite:#D8D8DC; --muted:#8A8A92; --faint:#8A8A92;
    --line:#2E2E32; --panel-2:#232326; --primary:#FFFFFF; --primary-ink:#111112; --accent:#6BA3E8; --brand:#FFFFFF; --warn:#C0994B;
  }}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:24px;}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 28px;}
  .brand{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:6px;}
  .robot{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;}
  .brand b{font-size:20px;font-weight:800;letter-spacing:-.02em;}
  h1{font-size:19px;font-weight:800;text-align:center;margin:14px 0 3px;}
  .sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 20px;}
  .tabs{display:flex;gap:4px;background:var(--panel-2);border-radius:10px;padding:4px;margin-bottom:18px;}
  .tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--sans);}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
  label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:600;}
  input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:11px 13px;font-size:15px;color:var(--ink);font-family:var(--sans);}
  input:focus{outline:none;border-color:var(--accent);background:var(--card);}
  .submit{width:100%;margin-top:20px;background:var(--primary);color:var(--primary-ink);border:none;border-radius:999px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .submit:hover{opacity:.92;} .submit:disabled{opacity:.5;cursor:default;}
  .err{color:var(--warn);font-size:13px;margin-top:14px;text-align:center;min-height:18px;}
  .foot{text-align:center;color:var(--faint);font-size:11.5px;margin-top:18px;}
</style>
<div class="card">
  <div class="brand"><svg width="26" height="26" viewBox="0 0 100 100" role="img" aria-label="Miles"><rect x="1.5" y="1.5" width="97" height="97" rx="26" fill="#111112"/><g fill="none" stroke="#fff" stroke-width="8"><path d="M31.6 31.6A26 26 0 0 0 68.4 68.4" stroke-opacity=".22"/><path d="M31.6 31.6A26 26 0 0 1 68.4 68.4"/></g><circle cx="42" cy="50" r="4" fill="#fff"/><circle cx="58" cy="50" r="4" fill="#fff"/></svg><b>miles.ai</b></div>
  <h1 id="title">Welcome back</h1>
  <p class="sub" id="subtitle">Sign in to your marketing employee.</p>
  <div class="tabs">
    <button id="tab-login" class="on">Log in</button>
    <button id="tab-signup">Sign up</button>
  </div>
  <form id="form">
    <div id="name-wrap" style="display:none"><label>Your name</label><input id="name" autocomplete="name" placeholder="Akhil Paul"></div>
    <label>Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@business.com" required>
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6">
    <label id="tos-wrap" style="display:none;flex-direction:row;align-items:flex-start;gap:8px;margin-top:14px;font-weight:400;font-size:12.5px;line-height:1.4;cursor:pointer">
      <input id="tos" type="checkbox" style="margin-top:2px;width:auto"> <span>I agree to the <a href="/terms" target="_blank" style="color:var(--accent)">Terms of Service</a>, including the use of anonymized, aggregated performance data for industry benchmarks.</span>
    </label>
    <button class="submit" id="submit" type="submit">Log in</button>
    <button type="button" id="forgot" style="width:100%;margin-top:10px;background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;font-family:var(--sans)">Forgot password?</button>
    <div class="err" id="err"></div>
    <div class="sub" id="msg" style="margin-top:10px;min-height:16px;color:var(--brand)"></div>
  </form>
  <div class="foot">Your data is stored on Miles. No credit card required.</div>
</div>
<script>
  let mode='login';
  const $=s=>document.getElementById(s);
  const params=new URLSearchParams(location.search);
  const resetToken=params.get('reset'), resetUid=params.get('uid');
  const inviteToken=params.get('invite');
  function setMode(m){
    mode=m;
    $('tab-login').classList.toggle('on',m==='login');
    $('tab-signup').classList.toggle('on',m==='signup');
    $('name-wrap').style.display = m==='signup'?'block':'none';
    $('tos-wrap').style.display = m==='signup'?'flex':'none';
    $('title').textContent = m==='signup'?'Create your account':'Welcome back';
    $('subtitle').textContent = m==='signup'?'Set up your marketing employee in a minute.':'Sign in to your marketing employee.';
    $('submit').textContent = m==='signup'?'Create account':'Log in';
    $('password').autocomplete = m==='signup'?'new-password':'current-password';
    $('forgot').style.display = m==='login'?'block':'none';
    $('err').textContent=''; $('msg').textContent='';
  }
  $('tab-login').onclick=()=>setMode('login');
  $('tab-signup').onclick=()=>setMode('signup');
  // Invite link — default to Sign up and show a friendly banner.
  if(inviteToken && !(resetToken && resetUid)){
    setMode('signup');
    $('subtitle').textContent='You’ve been invited — create your account below.';
    const b=document.createElement('div'); b.textContent='You have an invite to join Miles.'; b.style.cssText='text-align:center;font-size:12.5px;font-weight:600;color:var(--brand);background:var(--panel-2);border-radius:9px;padding:8px;margin-bottom:14px'; $('form').before(b);
  }
  // Reset-password mode (from an emailed / admin link).
  if(resetToken && resetUid){
    mode='reset';
    $('title').textContent='Set a new password';
    $('subtitle').textContent='Choose a new password for your account.';
    document.querySelector('.tabs').style.display='none';
    $('email').closest('label')?.remove?.(); $('email').style.display='none'; $('email').required=false;
    $('email').previousElementSibling && ($('email').previousElementSibling.style.display='none');
    $('password').autocomplete='new-password'; $('password').placeholder='New password (6+ characters)';
    $('submit').textContent='Set new password'; $('forgot').style.display='none';
  }
  $('forgot').onclick=async()=>{
    const email=$('email').value.trim(); if(!email){ $('err').textContent='Enter your email above, then click Forgot password.'; return; }
    $('err').textContent=''; $('forgot').disabled=true;
    try{ const r=await fetch('/auth/forgot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})}); const d=await r.json().catch(()=>({}));
      $('msg').textContent = d.emailConfigured ? 'If that email is registered, a reset link is on its way.' : 'Ask your admin for a reset link (email delivery isn’t set up yet).';
    }catch(e){ $('err').textContent='Network error — try again.'; }
    $('forgot').disabled=false;
  };
  $('form').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn=$('submit'); btn.disabled=true; $('err').textContent='';
    try{
      if(mode==='reset'){
        const r=await fetch('/auth/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({uid:resetUid,token:resetToken,password:$('password').value})});
        const d=await r.json().catch(()=>({})); if(!r.ok){ $('err').textContent=d.error||'Could not reset.'; btn.disabled=false; return; }
        window.location='/'; return;
      }
      if(mode==='signup' && !$('tos').checked){ $('err').textContent='Please accept the Terms of Service to create an account.'; btn.disabled=false; return; }
      const body={ email:$('email').value.trim(), password:$('password').value, name:$('name').value.trim(), invite:inviteToken||undefined, tos:mode==='signup'?$('tos').checked:undefined };
      const r=await fetch('/auth/'+(mode==='signup'?'signup':'login'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){ $('err').textContent=d.error||'Something went wrong.'; btn.disabled=false; return; }
      window.location='/';
    }catch(err){ $('err').textContent='Network error — try again.'; btn.disabled=false; }
  });
</script>
</body>
</html>
