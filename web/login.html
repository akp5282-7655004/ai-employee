<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miles — Sign in</title>
</head>
<body>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#0f1216; --muted:#5f6772; --faint:#98a0aa;
    --line:#e6e9ee; --panel-2:#f1f3f6; --primary:#0f1216; --primary-ink:#fff; --accent:#2f6bf6; --brand:#12a08f;
    --warn:#c9481f; --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(15,18,22,.05),0 12px 40px rgba(15,18,22,.10);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0c0f13; --card:#141a20; --ink:#e8ebee; --muted:#98a1ac; --faint:#6a727c;
    --line:#232a32; --panel-2:#1a1f26; --primary:#eef1f4; --primary-ink:#0c0f13; --accent:#6f97ff; --brand:#38c6b4; --warn:#e07a55;
  }}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:24px;}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 28px;}
  .brand{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:6px;}
  .robot{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;}
  .brand b{font-size:20px;font-weight:800;letter-spacing:-.02em;}
  h1{font-size:19px;font-weight:800;text-align:center;margin:14px 0 3px;}
  .sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 20px;}
  .tabs{display:flex;gap:4px;background:var(--panel-2);border-radius:10px;padding:4px;margin-bottom:18px;}
  .tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--sans);}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
  label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:600;}
  input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:11px 13px;font-size:15px;color:var(--ink);font-family:var(--sans);}
  input:focus{outline:none;border-color:var(--accent);background:var(--card);}
  .submit{width:100%;margin-top:20px;background:var(--primary);color:var(--primary-ink);border:none;border-radius:11px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .submit:hover{opacity:.92;} .submit:disabled{opacity:.5;cursor:default;}
  .err{color:var(--warn);font-size:13px;margin-top:14px;text-align:center;min-height:18px;}
  .foot{text-align:center;color:var(--faint);font-size:11.5px;margin-top:18px;}
</style>
<div class="card">
  <div class="brand"><span class="robot"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4M8 13h.01M16 13h.01"/></svg></span><b>miles.ai</b></div>
  <h1 id="title">Welcome back</h1>
  <p class="sub" id="subtitle">Sign in to your marketing employee.</p>
  <div class="tabs">
    <button id="tab-login" class="on">Log in</button>
    <button id="tab-signup">Sign up</button>
  </div>
  <form id="form">
    <div id="name-wrap" style="display:none"><label>Your name</label><input id="name" autocomplete="name" placeholder="Akhil Paul"></div>
    <label>Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@business.com" required>
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6">
    <button class="submit" id="submit" type="submit">Log in</button>
    <div class="err" id="err"></div>
  </form>
  <div class="foot">Your data is stored on Miles. No credit card required.</div>
</div>
<script>
  let mode='login';
  const $=s=>document.getElementById(s);
  function setMode(m){
    mode=m;
    $('tab-login').classList.toggle('on',m==='login');
    $('tab-signup').classList.toggle('on',m==='signup');
    $('name-wrap').style.display = m==='signup'?'block':'none';
    $('title').textContent = m==='signup'?'Create your account':'Welcome back';
    $('subtitle').textContent = m==='signup'?'Set up your marketing employee in a minute.':'Sign in to your marketing employee.';
    $('submit').textContent = m==='signup'?'Create account':'Log in';
    $('password').autocomplete = m==='signup'?'new-password':'current-password';
    $('err').textContent='';
  }
  $('tab-login').onclick=()=>setMode('login');
  $('tab-signup').onclick=()=>setMode('signup');
  $('form').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn=$('submit'); btn.disabled=true; $('err').textContent='';
    const body={ email:$('email').value.trim(), password:$('password').value, name:$('name').value.trim() };
    try{
      const r=await fetch('/auth/'+(mode==='signup'?'signup':'login'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){ $('err').textContent=d.error||'Something went wrong.'; btn.disabled=false; return; }
      window.location='/';
    }catch(err){ $('err').textContent='Network error — try again.'; btn.disabled=false; }
  });
</script>
</body>
</html>
