# One-click deploy to Render (free). In Render: New + → Blueprint → connect this
# repo → Apply. The app runs on the mock engine until you add keys, so it works
# with zero configuration.
services:
  - type: web
    name: miles
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      # REQUIRED. Accounts, passwords and login sessions live here. Paste a
      # Postgres connection string (Supabase or Neon, both free).
      #
      # The app refuses to start without it. That is deliberate: the old
      # behaviour — falling back to in-memory storage — meant every deploy,
      # crash or idle spin-down silently erased every account, which surfaced
      # later as "it doesn't remember my password". Failing to boot is loud;
      # losing customer accounts quietly is not.
      #
      # Check what a running deploy is on: GET /health -> "store".
      # To run on temporary storage on purpose, set ALLOW_EPHEMERAL_STORE=1.
      - key: DATABASE_URL
        sync: false
      # Pipedream Connect environment. Defaults to "development" (only YOU, signed
      # into pipedream.com, can connect apps). Set to "production" so your real
      # customers can connect their own accounts. Also set PIPEDREAM_PROJECT_ID /
      # _CLIENT_ID / _CLIENT_SECRET.
      - key: PIPEDREAM_ENVIRONMENT
        sync: false
      # Ad Studio image generation (fal.ai). Without it, Ad Studio still writes real
      # ad copy but shows a placeholder for the photo. Add your fal.ai key to
      # generate real ad images (Flux Schnell by default; override with FAL_IMAGE_MODEL).
      - key: FAL_KEY
        sync: false
      # Optional — pin the Creative Studio image/video models (defaults are
      # flux/schnell, flux/dev for premium, and kling-video for video).
      # - key: FAL_IMAGE_MODEL
      #   sync: false
      # - key: FAL_IMAGE_MODEL_PREMIUM
      #   sync: false
      # - key: FAL_VIDEO_MODEL
      #   sync: false
      # - key: FAL_TTS_MODEL
      #   sync: false
      # Model used for text-bearing designs (logo/flyer/social/card). Defaults to
      # fal-ai/recraft-v3 — far better at rendering legible text than flux.
      # - key: FAL_TEXT_MODEL
      #   sync: false
      # Optional — a free US Census API key. Research works without it (keyless,
      # ~500 calls/day), but a key raises limits and enables the competition layer
      # (ZIP Business Patterns). Get one free at api.census.gov/data/key_signup.html
      - key: CENSUS_API_KEY
        sync: false
      # Optional — Google Places key. Adds real competitor listings (names, ratings,
      # review counts) to the Research tab. Without it, Research shows the Census
      # competitor *count* only.
      - key: GOOGLE_PLACES_KEY
        sync: false
      # Language understanding — set ONE of these to switch it on (OpenRouter wins if both set).
      # OpenRouter: one key, every vendor (Claude/GPT/Gemini/open-source), one bill.
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional: pin the model OpenRouter uses (defaults to openai/gpt-4o-mini).
      # - key: OPENROUTER_MODEL
      #   sync: false
      # Or run direct on Anthropic instead:
      # - key: ANTHROPIC_API_KEY
      #   sync: false
