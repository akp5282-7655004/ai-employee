# One-click deploy to Render (free). In Render: New + → Blueprint → connect this
# repo → Apply. The app runs on the mock engine until you add keys, so it works
# with zero configuration.
services:
  - type: web
    name: miles
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Real durability — accounts + customer profiles survive restarts/deploys.
      # Paste a Postgres connection string (Supabase or Neon, both free). Without
      # it the app falls back to in-memory storage, which resets on every restart.
      - key: DATABASE_URL
        sync: false
      # Optional — add later to switch on real language understanding:
      # - key: ANTHROPIC_API_KEY
      #   sync: false
